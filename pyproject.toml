[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acta-ledger"
version = "0.1.0"
description = "Agent-native development ledger — captures why and how your code changed"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["development", "ledger", "mcp", "agent", "llm", "cursor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0",
    "mcp>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
acta = "acta.cli:main"

[project.urls]
Homepage = "https://github.com/ArnavDalmia/acta"
Repository = "https://github.com/ArnavDalmia/acta"
Documentation = "https://github.com/ArnavDalmia/acta#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/acta"]
